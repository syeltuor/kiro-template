# kiro-template v2.0.0
AWSTemplateFormatVersion: '2010-09-09'
Description: 'ACM certificate for the site (MUST be deployed in us-east-1 for CloudFront), DNS-validated'
# CloudFront only reads ACM certificates from us-east-1. Deploy this stack with
# --region us-east-1 regardless of where the rest of the app lives. Creation waits for
# DNS validation (usually 2-5 minutes).

Parameters:
  Project:
    Type: String
    AllowedPattern: '^[a-z][a-z0-9-]{1,30}$'
    Description: Project slug, used in tags
  DomainName:
    Type: String
    Description: Custom domain name for the site, e.g. app.example.com
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Route 53 hosted zone ID for the parent domain (looked up by deploy.sh)

Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: Name
          Value: !Sub "${DomainName}-certificate"
        - Key: Project
          Value: !Ref Project

Outputs:
  CertificateArn:
    Description: ACM certificate ARN for CloudFront (us-east-1)
    Value: !Ref Certificate
    Export:
      Name: !Sub "${AWS::StackName}-CertificateArn"
