# kiro-template v2.0.0
AWSTemplateFormatVersion: '2010-09-09'
Description: 'Cognito user pool (admin-create-only, Essentials), managed login v2 with branding, public web client (authorization code + PKCE)'
#
# Use this stack ONLY when the site needs authentication (security-standards:
# decision table row b). Public read-only sites need no Cognito. Standard
# configuration: .kiro/steering/cognito.md.
#
# BEFORE YOU CREATE THE POOL (checklist)
#   [ ] The site really needs auth (private/personal data, or any admin/write function).
#   [ ] The domain prefix is free: it is globally unique per region.
#         aws cognito-idp describe-user-pool-domain --domain <prefix> --region <region>
#       ("DomainDescription": {} means free).
#   [ ] No leftovers from a failed attempt: a retained pool (DeletionPolicy: Retain) and
#       a ROLLBACK_COMPLETE stack must be deleted before re-creating.
#         aws cognito-idp list-user-pools --max-results 60 --region <region>
#   [ ] AppUrl is the exact site origin with a trailing slash (callback + logout URL).
#   [ ] MFA decision made with the owner (OFF is fine for a single-user read-only
#       dashboard; ON for anything that changes data or money).
#   [ ] Branding colours copied from the app's CSS, light AND dark (RRGGBBAA hex).
#       The defaults below are a neutral placeholder palette: replace them per app.
#   [ ] ColorSchemeMode matches the app's default theme (LIGHT, DARK, or DYNAMIC if
#       the app follows the device).
#
# MANAGED LOGIN BRANDING LESSONS
#   - Managed login v2 (UserPoolDomain ManagedLoginVersion: 2, Essentials plan) shows an
#     ERROR page for any app client without a branding style. Always create an
#     AWS::Cognito::ManagedLoginBranding per client, DependsOn the UserPoolDomain.
#   - UseCognitoProvidedValues must be false when you supply Settings.
#   - Settings is a PARTIAL document: Cognito merges unspecified keys with its defaults.
#   - Set BOTH lightMode and darkMode for every component and class. colorSchemeMode
#     picks which one is used; a mode without keys shows Cognito's default colours
#     (the "wrong theme"). Match colorSchemeMode to the app's default theme.
#   - Colour defaults come from the app's CSS variables (staging/css/app.css), never a
#     generic palette.
#   - Changing branding: an in-place Settings update does not reliably regenerate the
#     hosted CSS, so replace the resource. A client can have only ONE branding style and
#     CloudFormation creates the replacement before deleting the old one, so a plain
#     rename fails with AlreadyExists. Two deploys: (1) remove the branding resource and
#     deploy (login page errors briefly), (2) add it back with the next suffix (V1 -> V2).
#   - The schema is strict: `link` and `input` are top-level `componentClasses`, NOT
#     `components` (otherwise: "$.components.link UnknownProperty", stack rolls back).
#   - To discover the real schema, create a temporary client with
#     UseCognitoProvidedValues: true and run
#       aws cognito-idp describe-managed-login-branding-by-client \
#         --user-pool-id <id> --client-id <id> --return-merged-resources
#     then copy the key paths you need.
#   - Test end to end: curl -sL the authorize URL with a real S256 PKCE challenge; the
#     final page must be the sign-in page with the expected <title>. An unregistered
#     redirect_uri must give redirect_mismatch.

Parameters:
  Project:
    Type: String
    AllowedPattern: '^[a-z][a-z0-9-]{1,30}$'
    Description: Project slug, used in resource names and tags
  AppUrl:
    Type: String
    AllowedPattern: '^https://[^\s]+/$'
    Description: Site URL used as the OAuth callback and sign-out URL (with trailing slash), e.g. https://app.example.com/
  CognitoDomainPrefix:
    Type: String
    AllowedPattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$'
    Description: Prefix for the managed login domain (globally unique per region)
  AppDisplayName:
    Type: String
    Default: My App
    Description: Name used in the invite email
  MfaConfiguration:
    Type: String
    Default: "OFF"
    AllowedValues: ["OFF", "OPTIONAL", "ON"]
    Description: Owner's call. OFF is acceptable for single-user read-only dashboards
  ColorSchemeMode:
    Type: String
    Default: LIGHT
    AllowedValues: [LIGHT, DARK, DYNAMIC]
    Description: Login page theme. Match the app's default theme; DYNAMIC follows the device.
  LightPageBackgroundColor:
    Type: String
    Default: f7f7f5ff
    AllowedPattern: '^[0-9a-fA-F]{8}$'
    Description: Light mode - Page background
  DarkPageBackgroundColor:
    Type: String
    Default: 121417ff
    AllowedPattern: '^[0-9a-fA-F]{8}$'
    Description: Dark mode - Page background
  LightFormBackgroundColor:
    Type: String
    Default: ffffffff
    AllowedPattern: '^[0-9a-fA-F]{8}$'
    Description: Light mode - Form card
  DarkFormBackgroundColor:
    Type: String
    Default: 1c1f24ff
    AllowedPattern: '^[0-9a-fA-F]{8}$'
    Description: Dark mode - Form card
  LightBorderColor:
    Type: String
    Default: e3e3e0ff
    AllowedPattern: '^[0-9a-fA-F]{8}$'
    Description: Light mode - Form and input borders
  DarkBorderColor:
    Type: String
    Default: 33373dff
    AllowedPattern: '^[0-9a-fA-F]{8}$'
    Description: Dark mode - Form and input borders
  LightPrimaryColor:
    Type: String
    Default: 2e7d32ff
    AllowedPattern: '^[0-9a-fA-F]{8}$'
    Description: Light mode - Primary button
  DarkPrimaryColor:
    Type: String
    Default: 66bb6aff
    AllowedPattern: '^[0-9a-fA-F]{8}$'
    Description: Dark mode - Primary button
  LightAccentColor:
    Type: String
    Default: 1b5e20ff
    AllowedPattern: '^[0-9a-fA-F]{8}$'
    Description: Light mode - Button hover/active and links
  DarkAccentColor:
    Type: String
    Default: 81c784ff
    AllowedPattern: '^[0-9a-fA-F]{8}$'
    Description: Dark mode - Button hover/active and links
  LightButtonTextColor:
    Type: String
    Default: ffffffff
    AllowedPattern: '^[0-9a-fA-F]{8}$'
    Description: Light mode - Text on the primary button
  DarkButtonTextColor:
    Type: String
    Default: 0d1f0eff
    AllowedPattern: '^[0-9a-fA-F]{8}$'
    Description: Dark mode - Text on the primary button
  LightTextColor:
    Type: String
    Default: 222222ff
    AllowedPattern: '^[0-9a-fA-F]{8}$'
    Description: Light mode - Headings and body text
  DarkTextColor:
    Type: String
    Default: ecececff
    AllowedPattern: '^[0-9a-fA-F]{8}$'
    Description: Dark mode - Headings and body text
  LightMutedTextColor:
    Type: String
    Default: 666666ff
    AllowedPattern: '^[0-9a-fA-F]{8}$'
    Description: Light mode - Descriptions
  DarkMutedTextColor:
    Type: String
    Default: a0a4abff
    AllowedPattern: '^[0-9a-fA-F]{8}$'
    Description: Dark mode - Descriptions
  LightInputBackgroundColor:
    Type: String
    Default: ffffffff
    AllowedPattern: '^[0-9a-fA-F]{8}$'
    Description: Light mode - Input fields
  DarkInputBackgroundColor:
    Type: String
    Default: 24282eff
    AllowedPattern: '^[0-9a-fA-F]{8}$'
    Description: Dark mode - Input fields
Conditions:
  MfaOff: !Equals [!Ref MfaConfiguration, "OFF"]

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub "${Project}-users"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true      # no self sign-up
        InviteMessageTemplate:
          EmailSubject: !Sub "Your ${AppDisplayName} account"
          # {username} and {####} are Cognito placeholders, not ${} references.
          EmailMessage: !Sub "Your ${AppDisplayName} account: {username}. Temporary password: {####}. Sign in at ${AppUrl}"
      MfaConfiguration: !Ref MfaConfiguration
      EnabledMfas: !If
        - MfaOff
        - !Ref AWS::NoValue
        - [SOFTWARE_TOKEN_MFA]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
      UserPoolTier: ESSENTIALS              # needed for managed login v2; never PLUS (no free tier)
      DeletionProtection: ACTIVE
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT  # fine for a handful of invites; SES for more
      UserPoolTags:
        Project: !Ref Project

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Ref CognitoDomainPrefix
      ManagedLoginVersion: 2

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "${Project}-web"
      GenerateSecret: false                 # public client: PKCE, no secret
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs: [!Ref AppUrl]           # pinned to the app origin
      LogoutURLs: [!Ref AppUrl]
      SupportedIdentityProviders: [COGNITO]
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      IdTokenValidity: 60
      AccessTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        IdToken: minutes
        AccessToken: minutes
        RefreshToken: days

  # Required with managed login v2: without a style the client shows an error page.
  # Partial settings document; unspecified keys keep Cognito's defaults.
  # Both lightMode and darkMode keys are set for every component: whichever mode is
  # missing falls back to Cognito's default (blue/white) colours.
  # The logical ID carries a version: see "Changing branding" in the header for the
  # two-deploy replacement (a plain rename fails with AlreadyExists).
  ManagedLoginBrandingV1:
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn: UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref UserPoolClient
      UseCognitoProvidedValues: false
      Settings:
        categories:
          global:
            colorSchemeMode: !Ref ColorSchemeMode
            pageHeader:
              enabled: false
            pageFooter:
              enabled: false
          form:
            location:
              horizontal: CENTER
              vertical: CENTER
            languageSelector:
              enabled: false
        components:
          pageBackground:
            lightMode:
              color: !Ref LightPageBackgroundColor
            darkMode:
              color: !Ref DarkPageBackgroundColor
            image:
              enabled: false
          form:
            lightMode:
              backgroundColor: !Ref LightFormBackgroundColor
              borderColor: !Ref LightBorderColor
            darkMode:
              backgroundColor: !Ref DarkFormBackgroundColor
              borderColor: !Ref DarkBorderColor
            borderRadius: 18
          primaryButton:
            lightMode:
              defaults:
                backgroundColor: !Ref LightPrimaryColor
                textColor: !Ref LightButtonTextColor
              hover:
                backgroundColor: !Ref LightAccentColor
                textColor: !Ref LightButtonTextColor
              active:
                backgroundColor: !Ref LightAccentColor
                textColor: !Ref LightButtonTextColor
            darkMode:
              defaults:
                backgroundColor: !Ref DarkPrimaryColor
                textColor: !Ref DarkButtonTextColor
              hover:
                backgroundColor: !Ref DarkAccentColor
                textColor: !Ref DarkButtonTextColor
              active:
                backgroundColor: !Ref DarkAccentColor
                textColor: !Ref DarkButtonTextColor
          pageText:
            lightMode:
              headingColor: !Ref LightTextColor
              bodyColor: !Ref LightTextColor
              descriptionColor: !Ref LightMutedTextColor
            darkMode:
              headingColor: !Ref DarkTextColor
              bodyColor: !Ref DarkTextColor
              descriptionColor: !Ref DarkMutedTextColor
        # link and input are component CLASSES, not components (strict schema).
        componentClasses:
          link:
            lightMode:
              defaults:
                textColor: !Ref LightAccentColor
              hover:
                textColor: !Ref LightTextColor
            darkMode:
              defaults:
                textColor: !Ref DarkAccentColor
              hover:
                textColor: !Ref DarkTextColor
          input:
            lightMode:
              defaults:
                backgroundColor: !Ref LightInputBackgroundColor
                borderColor: !Ref LightBorderColor
            darkMode:
              defaults:
                backgroundColor: !Ref DarkInputBackgroundColor
                borderColor: !Ref DarkBorderColor
Outputs:
  UserPoolId:
    Description: Cognito user pool ID
    Value: !Ref UserPool
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolId"
  UserPoolArn:
    Description: Cognito user pool ARN (for the API Gateway authorizer)
    Value: !GetAtt UserPool.Arn
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolArn"
  UserPoolClientId:
    Description: Public web client ID (no secret; code + PKCE)
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolClientId"
  CognitoBaseUrl:
    Description: Managed login base URL (also the CSP connect-src / form-action origin)
    Value: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
    Export:
      Name: !Sub "${AWS::StackName}-CognitoBaseUrl"
  IssuerUrl:
    Description: Token issuer URL
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
    Export:
      Name: !Sub "${AWS::StackName}-IssuerUrl"
  AuthorizeUrl:
    Description: Authorize URL without PKCE parameters (checks the login page loads; the app adds state + code_challenge)
    Value: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/authorize?client_id=${UserPoolClient}&response_type=code&scope=openid+email+profile&redirect_uri=${AppUrl}"
    Export:
      Name: !Sub "${AWS::StackName}-AuthorizeUrl"
