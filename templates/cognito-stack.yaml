# kiro-template v2.0.0
AWSTemplateFormatVersion: '2010-09-09'
Description: 'Cognito user pool (admin-create-only, Essentials), managed login v2 with branding, public web client (authorization code + PKCE)'
#
# Use this stack ONLY when the site needs authentication (security-standards:
# decision table row b). Public read-only sites need no Cognito. Standard
# configuration: .kiro/steering/cognito.md.
#
# BEFORE YOU CREATE THE POOL (checklist)
#   [ ] The site really needs auth (private/personal data, or any admin/write function).
#   [ ] The domain prefix is free: it is globally unique per region.
#         aws cognito-idp describe-user-pool-domain --domain <prefix> --region <region>
#       ("DomainDescription": {} means free).
#   [ ] No leftovers from a failed attempt: a retained pool (DeletionPolicy: Retain) and
#       a ROLLBACK_COMPLETE stack must be deleted before re-creating.
#         aws cognito-idp list-user-pools --max-results 60 --region <region>
#   [ ] AppUrl is the exact site origin with a trailing slash (callback + logout URL).
#   [ ] MFA decision made with the owner (OFF is fine for a single-user read-only
#       dashboard; ON for anything that changes data or money).
#   [ ] Branding colours chosen (RRGGBBAA hex, parameters below).
#
# MANAGED LOGIN BRANDING LESSONS
#   - Managed login v2 (UserPoolDomain ManagedLoginVersion: 2, Essentials plan) shows an
#     ERROR page for any app client without a branding style. Always create an
#     AWS::Cognito::ManagedLoginBranding per client, DependsOn the UserPoolDomain.
#   - UseCognitoProvidedValues must be false when you supply Settings.
#   - Settings is a PARTIAL document: Cognito merges unspecified keys with its defaults.
#   - The schema is strict: `link` and `input` are top-level `componentClasses`, NOT
#     `components` (otherwise: "$.components.link UnknownProperty", stack rolls back).
#   - To discover the real schema, create a temporary client with
#     UseCognitoProvidedValues: true and run
#       aws cognito-idp describe-managed-login-branding-by-client \
#         --user-pool-id <id> --client-id <id> --return-merged-resources
#     then copy the key paths you need.
#   - Test end to end: curl -sL the authorize URL with a real S256 PKCE challenge; the
#     final page must be the sign-in page with the expected <title>. An unregistered
#     redirect_uri must give redirect_mismatch.

Parameters:
  Project:
    Type: String
    AllowedPattern: '^[a-z][a-z0-9-]{1,30}$'
    Description: Project slug, used in resource names and tags
  AppUrl:
    Type: String
    AllowedPattern: '^https://[^\s]+/$'
    Description: Site URL used as the OAuth callback and sign-out URL (with trailing slash), e.g. https://app.example.com/
  CognitoDomainPrefix:
    Type: String
    AllowedPattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$'
    Description: Prefix for the managed login domain (globally unique per region)
  AppDisplayName:
    Type: String
    Default: My App
    Description: Name used in the invite email
  MfaConfiguration:
    Type: String
    Default: "OFF"
    AllowedValues: ["OFF", "OPTIONAL", "ON"]
    Description: Owner's call. OFF is acceptable for single-user read-only dashboards
  PageBackgroundColor:
    Type: String
    Default: 0e1322ff
    AllowedPattern: '^[0-9a-fA-F]{8}$'
  FormBackgroundColor:
    Type: String
    Default: 161d33ff
    AllowedPattern: '^[0-9a-fA-F]{8}$'
  BorderColor:
    Type: String
    Default: 2a3456ff
    AllowedPattern: '^[0-9a-fA-F]{8}$'
  PrimaryColor:
    Type: String
    Default: 8b6cf6ff
    AllowedPattern: '^[0-9a-fA-F]{8}$'
    Description: Primary button background
  AccentColor:
    Type: String
    Default: f050a8ff
    AllowedPattern: '^[0-9a-fA-F]{8}$'
    Description: Button hover/active and link colour
  TextColor:
    Type: String
    Default: e8ecf7ff
    AllowedPattern: '^[0-9a-fA-F]{8}$'
  MutedTextColor:
    Type: String
    Default: 9aa5c4ff
    AllowedPattern: '^[0-9a-fA-F]{8}$'
  InputBackgroundColor:
    Type: String
    Default: 1c2541ff
    AllowedPattern: '^[0-9a-fA-F]{8}$'

Conditions:
  MfaOff: !Equals [!Ref MfaConfiguration, "OFF"]

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub "${Project}-users"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true      # no self sign-up
        InviteMessageTemplate:
          EmailSubject: !Sub "Your ${AppDisplayName} account"
          # {username} and {####} are Cognito placeholders, not ${} references.
          EmailMessage: !Sub "Your ${AppDisplayName} account: {username}. Temporary password: {####}. Sign in at ${AppUrl}"
      MfaConfiguration: !Ref MfaConfiguration
      EnabledMfas: !If
        - MfaOff
        - !Ref AWS::NoValue
        - [SOFTWARE_TOKEN_MFA]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
      UserPoolTier: ESSENTIALS              # needed for managed login v2; never PLUS (no free tier)
      DeletionProtection: ACTIVE
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT  # fine for a handful of invites; SES for more
      UserPoolTags:
        Project: !Ref Project

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Ref CognitoDomainPrefix
      ManagedLoginVersion: 2

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "${Project}-web"
      GenerateSecret: false                 # public client: PKCE, no secret
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs: [!Ref AppUrl]           # pinned to the app origin
      LogoutURLs: [!Ref AppUrl]
      SupportedIdentityProviders: [COGNITO]
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      IdTokenValidity: 60
      AccessTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        IdToken: minutes
        AccessToken: minutes
        RefreshToken: days

  # Required with managed login v2: without a style the client shows an error page.
  # Partial settings document; unspecified keys keep Cognito's defaults.
  ManagedLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn: UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref UserPoolClient
      UseCognitoProvidedValues: false
      Settings:
        # Verified shape (dark theme). For a light theme set colorSchemeMode: LIGHT and
        # rename every darkMode key to lightMode, then verify with
        # describe-managed-login-branding-by-client --return-merged-resources.
        categories:
          global:
            colorSchemeMode: DARK
            pageHeader:
              enabled: false
            pageFooter:
              enabled: false
          form:
            location:
              horizontal: CENTER
              vertical: CENTER
            languageSelector:
              enabled: false
        components:
          pageBackground:
            darkMode:
              color: !Ref PageBackgroundColor
            image:
              enabled: false
          form:
            darkMode:
              backgroundColor: !Ref FormBackgroundColor
              borderColor: !Ref BorderColor
            borderRadius: 12
          primaryButton:
            darkMode:
              defaults:
                backgroundColor: !Ref PrimaryColor
                textColor: !Ref PageBackgroundColor
              hover:
                backgroundColor: !Ref AccentColor
                textColor: !Ref PageBackgroundColor
              active:
                backgroundColor: !Ref AccentColor
                textColor: !Ref PageBackgroundColor
          pageText:
            darkMode:
              headingColor: !Ref TextColor
              bodyColor: !Ref TextColor
              descriptionColor: !Ref MutedTextColor
        # link and input are component CLASSES, not components (strict schema).
        componentClasses:
          link:
            darkMode:
              defaults:
                textColor: !Ref AccentColor
              hover:
                textColor: !Ref TextColor
          input:
            darkMode:
              defaults:
                backgroundColor: !Ref InputBackgroundColor
                borderColor: !Ref BorderColor

Outputs:
  UserPoolId:
    Description: Cognito user pool ID
    Value: !Ref UserPool
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolId"
  UserPoolArn:
    Description: Cognito user pool ARN (for the API Gateway authorizer)
    Value: !GetAtt UserPool.Arn
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolArn"
  UserPoolClientId:
    Description: Public web client ID (no secret; code + PKCE)
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolClientId"
  CognitoBaseUrl:
    Description: Managed login base URL (also the CSP connect-src / form-action origin)
    Value: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
    Export:
      Name: !Sub "${AWS::StackName}-CognitoBaseUrl"
  IssuerUrl:
    Description: Token issuer URL
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
    Export:
      Name: !Sub "${AWS::StackName}-IssuerUrl"
  AuthorizeUrl:
    Description: Authorize URL without PKCE parameters (checks the login page loads; the app adds state + code_challenge)
    Value: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/authorize?client_id=${UserPoolClient}&response_type=code&scope=openid+email+profile&redirect_uri=${AppUrl}"
    Export:
      Name: !Sub "${AWS::StackName}-AuthorizeUrl"
